name: Question
description: How do I do something with Fusion?
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        The [documentation index](https://github.com/gotreasa/jest-cucumber-fusion/blob/main/docs/README.md) may already answer it, and the README's [Troubleshooting](https://github.com/gotreasa/jest-cucumber-fusion#troubleshooting) list covers the errors people hit most often.
  - type: input
    id: version
    attributes:
      label: Package version
      description: The `@g_package/jest-cucumber-fusion` version, from `npm ls @g_package/jest-cucumber-fusion`, and whether your step files use `import` or `require`.
      placeholder: "3.0.4, ES modules"
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What you have tried
      description: Any feature file, step definitions or output that helps.
