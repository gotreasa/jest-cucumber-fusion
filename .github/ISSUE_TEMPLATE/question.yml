name: Question
description: How do I do something with Fusion?
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        The [documentation index](https://github.com/gotreasa/jest-cucumber-fusion/blob/main/docs/README.md) may already answer it.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What you have tried
      description: Any feature file, step definitions or output that helps.
