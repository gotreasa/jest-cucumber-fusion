version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A production dependency bump is fix(deps), so merging it releases a patch:
    # the CommonJS build bundles @cucumber/gherkin and the others, and a consumer
    # gets their fixes only through a new release of this package. Development
    # bumps stay chore(deps-dev), which releases nothing.
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      # Minor and patch bumps land as one PR; majors stay as separate PRs so
      # one breaking change cannot hold the rest back.
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
