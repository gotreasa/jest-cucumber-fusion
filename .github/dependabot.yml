version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A production dependency bump is fix(deps), so merging it releases a patch:
    # the CommonJS build bundles @cucumber/gherkin and the others, and a consumer
    # gets their fixes only through a new release of this package. Development
    # bumps stay chore(deps-dev), which releases nothing.
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    ignore:
      # The type check (jsconfig.json) holds these on purpose. @types/node follows the oldest
      # Node the package supports (18), so it flags newer Node APIs. TypeScript 7 cannot
      # install yet: typescript-eslint, through eslint-plugin-jest, accepts <6.1.0 only.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      # Minor and patch bumps land as one PR; majors stay as separate PRs so
      # one breaking change cannot hold the rest back.
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
