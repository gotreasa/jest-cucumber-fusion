name: Continuous Integration

on:
  pull_request:
  # A push to main runs the release job below, which stages the npm release, so this trigger is
  # what ships one: it must name the default branch. package.json's release.branches names main
  # alone, so a branch called master that comes back cannot take over the release channel.
  push:
    branches:
      - main
      - 'releases/*'
  workflow_dispatch:

jobs:
  prettier:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        # Make sure the actual branch is checked out when running on pull requests
        ref: ${{ github.head_ref }}

    - name: Prettify code
      uses: creyD/prettier_action@v4.6
      with:
        # This part is also where you can pass other options, for example:
        prettier_options: --check **/*.{js,cjs,md,ts}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Its own check, so a lint failure is named as one. A required check on main, beside
  # prettier, integration and the three compat checks.
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Integrating
      run: npm ci

    - name: Linting
      run: npm run lint

    # TypeScript checks src/ as JavaScript (jsconfig.json); nothing is compiled or shipped, and
    # the build reads none of it (scripts/build-cjs.js). It runs after a lint failure too, so
    # both results show.
    - name: Type checking
      if: success() || failure()
      run: npm run typecheck

  # The packed package in a fresh consumer project on each Node floor the docs promise:
  # CommonJS from 18.14, ES modules from 20.11 (and the documented failure below it). The
  # repository's own suite needs Node 20.11, so the tarball is built on Node 24 first.
  compat:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18.14.0', '20.11.0', '22']

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Node 24 to build
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Integrating
      run: npm ci

    - name: Packing
      run: npm pack --pack-destination "$RUNNER_TEMP"

    - name: Setup Node ${{ matrix.node }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node }}

    - name: Consumer smoke test
      run: bash test/compat/consumer-smoke.sh "$RUNNER_TEMP"/*.tgz

  integration:
    # Waits for lint, so semantic-release never releases code that fails it.
    needs: lint
    runs-on: ubuntu-latest
    # semantic-release pushes the version tag, creates the GitHub release, and
    # comments on released issues/PRs — all of which need write access. The
    # default GITHUB_TOKEN is read-only, which caused EGITNOPERMISSION.
    # id-token: write lets the staging step authenticate to npm as a trusted publisher
    # (OIDC) and sign the provenance attestation; with attestations: write it also signs and
    # stores the SBOM attestation.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:
    - name: Checking code
      uses: actions/checkout@v7
      with:
        # semantic-release needs full history + tags to determine the release
        fetch-depth: 0

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Integrating
      run: npm ci

    - name: Testing
      run: npm test

    - name: Type checking
      run: npm run test-d

    - name: Baseline checks
      run: npm run test:baseline

    - name: Secret scan
      run: npm run lint:secrets

    - name: Code coverage
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

    # The release gate for known vulnerabilities in what ships. Runtime dependencies only:
    # development ones never reach a consumer. It runs wherever a release can be made (a push,
    # or a manual run), not on pull requests, so an advisory published overnight blocks the next
    # release, not every open pull request.
    - name: Auditing runtime dependencies
      if: github.event_name != 'pull_request'
      run: npm audit --omit dev --audit-level=high

    # semantic-release decides the version, tags it and writes the GitHub release, but does not
    # publish to npm (npmPublish: false in package.json): it leaves the versioned tarball in
    # release/ instead, and the next step stages it. After @semantic-release/npm has written
    # the version, @semantic-release/exec writes the release's SBOM beside the tarball
    # (CycloneDX, runtime dependencies only), and @semantic-release/github attaches it to the
    # GitHub release. The CommonJS build bundles those dependencies (scripts/build-cjs.js),
    # where a consumer's own npm audit cannot see them; the SBOM is the record of them.
    - name: Releasing
      run: npx semantic-release
      env:
        GITHUB_TOKEN:     ${{ secrets.GITHUB_TOKEN }}

    # sbom-path takes one file, not a glob, so its name is found first. No SBOM means no
    # release was made (a pull request, or no releasable commit), and the next step is skipped.
    # @semantic-release/github only logs an asset it could not upload, and the release goes on,
    # so this step also checks that the SBOM is on the GitHub release, before anything is staged.
    - name: Finding the SBOM
      id: sbom
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        shopt -s nullglob
        sboms=(release/*.cdx.json)
        if [ ${#sboms[@]} -eq 0 ]; then
          exit 0
        fi
        sbom="${sboms[0]}"
        file="$(basename "$sbom")"
        version="${file#jest-cucumber-fusion-}"
        version="${version%.cdx.json}"
        # The tag is v<version>, semantic-release's default tagFormat; a different one fails here.
        assets="$(gh release view "v$version" --json assets --jq '.assets[].name')"
        if ! grep -qxF "$file" <<< "$assets"; then
          echo "::error::$file is not attached to the GitHub release v$version."
          exit 1
        fi
        echo "path=$sbom" >> "$GITHUB_OUTPUT"

    # Signs the SBOM as a statement about the tarball that is staged next, so anyone can check
    # it with gh attestation verify <tarball> --repo gotreasa/jest-cucumber-fusion. This is
    # actions/attest with sbom-path: actions/attest-sbom 4 is deprecated and only wraps it.
    - name: Attesting the SBOM
      if: steps.sbom.outputs.path != ''
      uses: actions/attest@v4
      with:
        subject-path: release/*.tgz
        sbom-path: ${{ steps.sbom.outputs.path }}

    # A release is staged on npm, not published: a maintainer approves it with 2FA
    # (npm stage approve <stage-id>, or npmjs.com > Staged Packages). npm authenticates
    # this workflow as the package's trusted publisher (OIDC, no token), configured on
    # npmjs.com with only staging allowed, so it cannot publish directly. --provenance
    # attaches a signed attestation linking the version to this commit and workflow run;
    # it is kept when the staged version is approved. Staging needs npm 11.15 and Node
    # 22.14 or newer (this job runs Node 24); trusted publishing also needs package.json's
    # repository.url to match this repository exactly.
    - name: Staging the release for approval
      if: github.event_name == 'push'
      run: |
        shopt -s nullglob
        # ./ matters: npm reads a bare release/x.tgz as a GitHub user/repo shorthand.
        tarballs=(./release/*.tgz)
        if [ ${#tarballs[@]} -eq 0 ]; then
          echo "No release was made, so there is nothing to stage."
          exit 0
        fi
        npm stage publish "${tarballs[0]}" --tag latest --access public --provenance
