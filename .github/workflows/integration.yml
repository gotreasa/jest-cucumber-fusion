name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - master
      - 'releases/*'
  workflow_dispatch:

jobs:
  prettier:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        # Make sure the actual branch is checked out when running on pull requests
        ref: ${{ github.head_ref }}

    - name: Prettify code
      uses: creyD/prettier_action@v4.6
      with:
        # This part is also where you can pass other options, for example:
        prettier_options: --check **/*.{js,cjs,md,ts}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Its own check, so a lint failure is named as one. A required check on master, beside
  # prettier and integration.
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Integrating
      run: npm ci

    - name: Linting
      run: npm run lint

  # The packed package in a fresh consumer project on each Node floor the docs promise:
  # CommonJS from 18.14, ES modules from 20.11 (and the documented failure below it). The
  # repository's own suite needs Node 20.11, so the tarball is built on Node 24 first.
  compat:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18.14.0', '20.11.0', '22']

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Node 24 to build
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Integrating
      run: npm ci

    - name: Packing
      run: npm pack --pack-destination "$RUNNER_TEMP"

    - name: Setup Node ${{ matrix.node }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node }}

    - name: Consumer smoke test
      run: bash test/compat/consumer-smoke.sh "$RUNNER_TEMP"/*.tgz

  integration:
    # Waits for lint, so semantic-release never releases code that fails it.
    needs: lint
    runs-on: ubuntu-latest
    # semantic-release pushes the version tag, creates the GitHub release, and
    # comments on released issues/PRs — all of which need write access. The
    # default GITHUB_TOKEN is read-only, which caused EGITNOPERMISSION.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
    - name: Checking code
      uses: actions/checkout@v7
      with:
        # semantic-release needs full history + tags to determine the release
        fetch-depth: 0

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Integrating
      run: npm ci

    - name: Testing
      run: npm test

    - name: Type checking
      run: npm run test-d

    - name: Baseline checks
      run: npm run test:baseline

    - name: Secret scan
      run: npm run lint:secrets

    - name: Code coverage
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Releasing
      run: npx semantic-release
      env:
        GITHUB_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
        NPM_TOKEN:        ${{ secrets.NPM_TOKEN }}
